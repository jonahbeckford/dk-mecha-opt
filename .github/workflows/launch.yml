name: launch

# Starts the app on a runner and keeps a screenshot, so a green build means the app also started and
# showed its window. build.yml only builds. Desktop is checked on one runner per OS; the Android and
# iOS builds run in an emulator and a simulator. Each job fails when no usable screenshot is written.
# A screenshot is a record, not an assertion: someone looks at it.
# Manual only: the macOS and Windows jobs are billed at a multiple of Linux minutes, and these jobs
# ran on every push. Start it from the Actions tab (Run workflow) when a launch check is wanted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: launch desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Linux display tools
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick
      - name: Launch and screenshot
        shell: pwsh
        run: ./scripts/take-screenshot.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-desktop-${{ matrix.os }}
          path: artifacts/screenshots/*.png
          if-no-files-found: error

  android:
    name: launch android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: system-images;android-34;google_apis;x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: microsoft
          java-version: 17
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install android
      # The runner died during Build with no log when the emulator image was installed first. Free disk
      # up front, and install the emulator and system image only after the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /opt/microsoft /usr/local/lib/node_modules
          df -h /
      - name: Android NDK and platform (versions pinned in scripts/dev-common.ps1)
        shell: pwsh
        run: |
          . ./scripts/dev-common.ps1
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          & $sdkmanager "ndk;$($script:NdkVersion)" "platforms;$($script:AndroidPlatform)" "build-tools;$($script:AndroidBuildTools)"
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed' }
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Target android -Publish
      - name: Emulator and system image
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager'
          & $sdkmanager emulator platform-tools $env:IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager failed' }
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the emulator, install, launch, screenshot
        run: |
          set -eu
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo no | avdmanager create avd -n ci -k "$IMAGE" --force
          nohup emulator -avd ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { tail -40 emulator.log; echo 'emulator did not boot'; exit 1; }
          APK="$(find artifacts/publish/android -name '*-Signed.apk' | head -1)"
          echo "Installing $APK"
          adb install -r "$APK"
          adb shell monkey -p com.diskuv.mechadk -c android.intent.category.LAUNCHER 1
          sleep 20
          mkdir -p artifacts/screenshots
          adb exec-out screencap -p > artifacts/screenshots/android-emulator.png
          [ "$(wc -c < artifacts/screenshots/android-emulator.png)" -gt 1024 ]
          adb logcat -d -t 200 > artifacts/screenshots/android-logcat.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: launch-android
          path: |
            artifacts/screenshots/*
            emulator.log
          if-no-files-found: warn

  ios:
    name: launch ios simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install ios
      - name: Build (simulator, unsigned)
        shell: pwsh
        run: ./scripts/build.ps1 -Target ios -Property ValidateXcodeVersion=false
      - name: Boot a simulator, install, launch, screenshot
        run: |
          set -eu
          APP="$(find src/MechaDk/bin/Debug/net10.0-ios26.0/iossimulator-arm64 -maxdepth 1 -type d -name '*.app' | head -1)"
          echo "App: $APP"
          UDID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          echo "Simulator: $UDID"
          # The build is unsigned (EnableCodeSigning=false). The simulator kills an unsigned app at startup
          # with SIGKILL (Code Signature Invalid), so sign it ad hoc, with no identity, before installing.
          codesign --force --deep --sign - "$APP"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p artifacts/screenshots
          # --console keeps the app's stdout and stderr, which is where a managed crash shows up
          xcrun simctl launch --console "$UDID" com.diskuv.mechadk > artifacts/screenshots/ios-console.log 2>&1 &
          sleep 20
          xcrun simctl io "$UDID" screenshot artifacts/screenshots/ios-simulator.png
          [ "$(wc -c < artifacts/screenshots/ios-simulator.png)" -gt 1024 ]
          echo '--- app console'; cat artifacts/screenshots/ios-console.log
          echo '--- crash reports'; ls -la "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null || true
          cp "$HOME"/Library/Logs/DiagnosticReports/*.ips artifacts/screenshots/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: launch-ios
          path: artifacts/screenshots/*
          if-no-files-found: warn
